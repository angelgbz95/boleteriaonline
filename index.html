<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletería Online - Sala Simple</title>
    <style>
        body { font-family: sans-serif; background-color: #0f0f0f; color: white; text-align: center; margin: 0; padding-bottom: 50px; }
        h1 { color: #d4af37; margin-top: 30px; }
        
        .escenario {
            background: #333; width: 60%; height: 40px; margin: 20px auto;
            border-radius: 0 0 40px 40px; display: flex; align-items: center; 
            justify-content: center; color: #777; font-weight: bold;
        }

        /* La grilla ahora se adapta automáticamente al dibujo */
        .sala { 
            display: grid; gap: 8px; margin: 20px auto; 
            justify-content: center; width: fit-content;
            padding: 20px; background: #1a1a1a; border-radius: 10px;
        }

        .asiento {
            width: 35px; height: 35px; background-color: #27ae60;
            border-radius: 5px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 11px;
        }
        .asiento.ocupado { background-color: #c0392b; cursor: not-allowed; }
        .asiento.pendiente { background-color: #f39c12; color: black; }
        .pasillo { width: 35px; height: 35px; background: transparent; }

        /* Modales */
        .modal-fondo { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 100; }
        .modal-contenido { background: #222; padding: 20px; border-radius: 8px; width: 300px; border: 1px solid #d4af37; text-align: left; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; background: #333; color: white; border: 1px solid #444; }
        button { width: 100%; padding: 12px; cursor: pointer; font-weight: bold; border-radius: 4px; border: none; }
        .btn-confirmar { background: #d4af37; color: black; margin-top: 10px; }
        .btn-mercado { background: #009ee3; color: white; text-decoration: none; display: block; text-align: center; padding: 12px; margin-top: 10px; border-radius: 4px; }
        .btn-wa { color: #25D366; text-decoration: none; display: block; text-align: center; padding: 8px; margin-top: 10px; border: 1px solid #25D366; }
    </style>
</head>
<body>

    <h1>🩰 Galas de Ballet</h1>
    <div class="escenario">ESCENARIO</div>
    
    <div id="contenedor-asientos" class="sala"></div>

    <div id="modalForm" class="modal-fondo">
        <div class="modal-contenido">
            <h3 id="titulo-asiento"></h3>
            <input type="text" id="nombre" placeholder="Nombre completo">
            <input type="number" id="dni" placeholder="DNI">
            <input type="tel" id="tel" placeholder="Teléfono">
            <div style="font-size: 13px; margin: 10px 0;">
                <label><input type="radio" name="pago" value="mp" checked> Mercado Pago</label><br>
                <label><input type="radio" name="pago" value="efectivo"> Efectivo</label>
            </div>
            <button class="btn-confirmar" onclick="confirmarReserva()">RESERVAR</button>
            <button style="background:transparent; color:#888" onclick="cerrar()">Cancelar</button>
        </div>
    </div>

    <div id="modalInstrucciones" class="modal-fondo">
        <div class="modal-contenido" style="text-align:center">
            <h3>⏳ ¡Reserva Iniciada!</h3>
            <p>Tiempo restante: <b id="timer" style="color:#f39c12">--:--</b></p>
            <a href="https://wa.me/5493764374689" target="_blank" class="btn-wa">📲 Enviar Comprobante</a>
            <a id="btnMP" href="#" target="_blank" class="btn-mercado">PAGAR AHORA</a>
            <button style="background:transparent; color:#888; margin-top:10px" onclick="cerrar()">Cerrar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFg-4F6_bVHP7xYAOlUVwFiTTUoZ-ltVc",
            authDomain: "boleteria-piloto.firebaseapp.com",
            projectId: "boleteria-piloto",
            storageBucket: "boleteria-piloto.firebasestorage.app",
            messagingSenderId: "888414257363",
            appId: "1:888414257363:web:7653fbdf87284bd6645426"
        };
        const LINK_DE_PAGO = " https://mpago.la/1dGP6Qs ";

        // --- 🏗️ EL DIBUJO DE TU SALA ---
        // A = Asiento, _ = Pasillo
        const mapa = [
            "AAA_AAAAAA_AAA", // Fila 1
            "AAA_AAAAAA_AAA"  // Fila 2
        ];

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const contenedor = document.getElementById('contenedor-asientos');
        let selId = "", intervalo;

        function dibujar(datos) {
            contenedor.innerHTML = '';
            contenedor.style.gridTemplateColumns = `repeat(${mapa[0].length}, 1fr)`;

            mapa.forEach((fila, fIdx) => {
                let nAsiento = 1;
                for (let char of fila) {
                    const div = document.createElement('div');
                    if (char === '_') {
                        div.className = 'pasillo';
                    } else {
                        const id = `F${fIdx+1}-A${nAsiento}`;
                        div.className = 'asiento';
                        div.innerText = nAsiento;
                        if (datos[id]) {
                            div.classList.add(datos[id].estado === 'ocupado' ? 'ocupado' : 'pendiente');
                        } else {
                            div.onclick = () => {
                                selId = id;
                                document.getElementById('titulo-asiento').innerText = "Butaca " + id;
                                document.getElementById('modalForm').style.display = 'flex';
                            };
                        }
                        nAsiento++;
                    }
                    contenedor.appendChild(div);
                }
            });
        }

        window.cerrar = () => {
            document.querySelectorAll('.modal-fondo').forEach(m => m.style.display = 'none');
            clearInterval(intervalo);
        };

        window.confirmarReserva = async () => {
            const nom = document.getElementById('nombre').value;
            const dni = document.getElementById('dni').value;
            const tel = document.getElementById('tel').value;
            const pago = document.querySelector('input[name="pago"]:checked').value;

            if (!nom || !dni || !tel) return alert("Completa los datos");

            const mins = (pago === 'mp') ? 15 : 1440;
            const limite = new Date().getTime() + (mins * 60 * 1000);

            await setDoc(doc(db, "asientos_gala", selId), {
                estado: "pendiente", cliente: nom, dni, tel, limite, pago
            });

            document.getElementById('modalForm').style.display = 'none';
            document.getElementById('btnMP').style.display = (pago === 'mp' ? 'block' : 'none');
            document.getElementById('btnMP').href = LINK_DE_PAGO;
            
            iniciarReloj(mins);
            document.getElementById('modalInstrucciones').style.display = 'flex';
        };

        function iniciarReloj(m) {
            let t = m * 60;
            const vis = document.getElementById('timer');
            intervalo = setInterval(async () => {
                let mins = Math.floor(t / 60), segs = t % 60;
                vis.innerText = `${mins}:${segs < 10 ? '0'+segs : segs}`;
                if (t-- <= 0) {
                    clearInterval(intervalo);
                    await deleteDoc(doc(db, "asientos_gala", selId));
                    window.location.reload();
                }
            }, 1000);
        }

        onSnapshot(collection(db, "asientos_gala"), (snap) => {
            const d = {};
            snap.forEach(doc => d[doc.id] = doc.data());
            dibujar(d);
        });
    </script>
</body>
</html>
