<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Gala de Ballet</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding: 20px; }
        h1 { color: #d4af37; }
        
        .controles { margin-bottom: 30px; background: #222; padding: 20px; border-radius: 10px; border: 1px solid #444; }
        
        .sala { 
            display: grid; gap: 8px; margin: 20px auto; 
            justify-content: center; width: fit-content;
            padding: 20px; background: #000; border-radius: 10px;
        }

        .asiento {
            width: 40px; height: 40px; background-color: #27ae60;
            border-radius: 5px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 11px;
            color: white; font-weight: bold;
        }
        .asiento.ocupado { background-color: #c0392b; }
        .asiento.pendiente { background-color: #f39c12; color: black; }
        .pasillo { width: 40px; height: 40px; background: transparent; }

        .btn-reset {
            background-color: #e74c3c; color: white; padding: 15px 25px;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
            margin-top: 10px;
        }
        .btn-reset:hover { background-color: #c0392b; }

        /* Estilos de la tabla de datos */
        table { width: 100%; max-width: 900px; margin: 30px auto; border-collapse: collapse; background: #222; }
        th, td { padding: 12px; border: 1px solid #444; text-align: left; }
        th { background: #d4af37; color: black; }
        .btn-vender { background: #2ecc71; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .btn-borrar { background: #e74c3c; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; color: white; }
    </style>
</head>
<body>

    <h1>⚙️ Administración de Butacas</h1>

    <div class="controles">
        <p>Desde aquí puedes confirmar ventas manuales o vaciar la sala.</p>
        <button class="btn-reset" onclick="liberarTodasLasButacas()">🔥 LIBERAR TODAS LAS BUTACAS</button>
    </div>

    <div id="contenedor-asientos" class="sala"></div>

    <h3>Lista de Reservas Activas</h3>
    <table id="tabla-reservas">
        <thead>
            <tr>
                <th>Butaca</th>
                <th>Cliente</th>
                <th>Pago</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- ⚠️ PEGA AQUÍ TUS MISMAS CLAVES DE FIREBASE ⚠️ ---
        const firebaseConfig = {
            apiKey: "AIzaSyDFg-4F6_bVHP7xYAOlUVwFiTTUoZ-ltVc",
            authDomain: "boleteria-piloto.firebaseapp.com",
            projectId: "boleteria-piloto",
            storageBucket: "boleteria-piloto.firebasestorage.app",
            messagingSenderId: "888414257363",
            appId: "1:888414257363:web:7653fbdf87284bd6645426"
        };

        // --- 🏗️ EL MISMO MAPA QUE EN INDEX.HTML ---
        const mapa = [
            "AAA_AAAAAA_AAA",
            "AAA_AAAAAA_AAA"
        ];

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const contenedor = document.getElementById('contenedor-asientos');
        const tablaBody = document.querySelector('#tabla-reservas tbody');

        function dibujarAdmin(datos) {
            contenedor.innerHTML = '';
            tablaBody.innerHTML = '';
            contenedor.style.gridTemplateColumns = `repeat(${mapa[0].length}, 1fr)`;

            mapa.forEach((fila, fIdx) => {
                let nAsiento = 1;
                for (let char of fila) {
                    const div = document.createElement('div');
                    if (char === '_') {
                        div.className = 'pasillo';
                    } else {
                        const id = `F${fIdx+1}-A${nAsiento}`;
                        div.className = 'asiento';
                        div.innerText = nAsiento;

                        if (datos[id]) {
                            const d = datos[id];
                            div.classList.add(d.estado === 'ocupado' ? 'ocupado' : 'pendiente');
                            
                            // Agregar a la tabla
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${id}</td>
                                <td>${d.cliente || 'S/D'} <br> <small>${d.tel || ''}</small></td>
                                <td>${d.pago === 'mp' ? '💳 MP' : '💵 Efec.'}</td>
                                <td>
                                    ${d.estado === 'pendiente' ? `<button class="btn-vender" onclick="confirmarVenta('${id}')">Confirmar Pago</button>` : ''}
                                    <button class="btn-borrar" onclick="borrarReserva('${id}')">Borrar</button>
                                </td>
                            `;
                            tablaBody.appendChild(tr);
                        }
                        nAsiento++;
                    }
                    contenedor.appendChild(div);
                }
            });
        }

        // --- ⚡ FUNCIONES DE ACCIÓN ---

        window.confirmarVenta = async (id) => {
            if(confirm(`¿Confirmar pago de la butaca ${id}? Pasará a ROJO.`)) {
                const ref = doc(db, "asientos_gala", id);
                await setDoc(ref, { estado: 'ocupado' }, { merge: true });
            }
        };

        window.borrarReserva = async (id) => {
            if(confirm(`¿Deseas eliminar la reserva de ${id}? Pasará a VERDE.`)) {
                await deleteDoc(doc(db, "asientos_gala", id));
            }
        };

        window.liberarTodasLasButacas = async () => {
            const respuesta = confirm("⚠️ ¡ATENCIÓN! Esto borrará TODAS las reservas y ventas. ¿Estás seguro?");
            if (respuesta) {
                const querySnapshot = await getDocs(collection(db, "asientos_gala"));
                const promesas = [];
                querySnapshot.forEach((documento) => {
                    promesas.push(deleteDoc(doc(db, "asientos_gala", documento.id)));
                });
                await Promise.all(promesas);
                alert("✅ Sala vaciada correctamente.");
            }
        };

        // Escuchar DB
        onSnapshot(collection(db, "asientos_gala"), (snap) => {
            const d = {};
            snap.forEach(doc => d[doc.id] = d.data());
            dibujarAdmin(d);
        });
    </script>
</body>
</html>
